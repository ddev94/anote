00 L450.06 395.3" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"></path><text x="155.0" y="213.55" font-family="Helvetica, Arial, sans-serif" font-size="20px" fill="#1e1e1e" text-anchor="middle" font-weight="700">Login.note</text><text x="155.0" y="234.43" font-family="Helvetica, Arial, sans-serif" font-size="14px" fill="#5c5c5c" text-anchor="middle">a JSON array of blocks</text><text x="155.0" y="253.33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14px" fill="#5c5c5c" text-anchor="middle">Login.note.assets/</text><text x="155.0" y="272.23" font-family="Helvetica, Arial, sans-serif" font-size="14px" fill="#5c5c5c" text-anchor="middle">the pictures, beside it</text><text x="155" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14px" fill="#5c5c5c" text-anchor="middle">one file, in your repository</text><text x="625.0" y="67.435" font-family="Helvetica, Arial, sans-serif" font-size="18px" fill="#1e1e1e" text-anchor="middle" font-weight="700">The editor</text><text x="625.0" y="86.635" font-family="Helvetica, Arial, sans-serif" font-size="13px" fill="#5c5c5c" text-anchor="middle">a VS Code tab</text><text x="625.0" y="177.435" font-family="Helvetica, Arial, sans-serif" font-size="18px" fill="#1e1e1e" text-anchor="middle" font-weight="700">The preview</text><text x="625.0" y="196.635" font-family="Helvetica, Arial, sans-serif" font-size="13px" fill="#5c5c5c" text-anchor="middle">a webview, or a page in Chrome</text><text x="625.0" y="287.435" font-family="Helvetica, Arial, sans-serif" font-size="18px" fill="#1e1e1e" text-anchor="middle" font-weight="700">The studio</text><text x="625.0" y="306.635" font-family="Helvetica, Arial, sans-serif" font-size="13px" fill="#5c5c5c" text-anchor="middle">the same editor, in a browser tab</text><text x="625.0" y="397.435" font-family="Helvetica, Arial, sans-serif" font-size="18px" fill="#1e1e1e" text-anchor="middle" font-weight="700">An agent</text><text x="625.0" y="416.635" font-family="Helvetica, Arial, sans-serif" font-size="13px" fill="#5c5c5c" text-anchor="middle">seven MCP tools over the same file</text><text x="400" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13px" fill="#5c5c5c" text-anchor="middle">nothing in the middle: every surface reads the file</text></svg>