name: Feature request
description: Something ANote should do and doesn't
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution — the note you were writing when you
        wanted this. A described problem gets a better answer than a described
        feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape for it, describe it here.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: >
        The other app you switch to, or the syntax you type by hand. ANote exists
        to keep you in the editor and out of the syntax, so this is the most
        useful box on the form.

  - type: dropdown
    id: format
    attributes:
      label: Which format does this concern
      description: >
        `.md` can only hold what every other markdown reader understands, so some
        things can only ever be a `.note` feature.
      options:
        - "`.note`"
        - "`.md`"
        - Both
        - Neither / not sure
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you be willing to work on this?
      options:
        - label: I'd be up for opening a pull request
          required: false
