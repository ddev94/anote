name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push or a second push to a PR makes the earlier run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: test (${{ matrix.os }})
    # The suite is host-side code — the config reader, the markdown round trip,
    # the preview and studio routes, the MCP tools — and all of it touches paths,
    # a loopback HTTP server and files beside a note. ANote ships to whatever
    # platform VS Code runs on, so "it works on my macOS" is not the whole story.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      # Bundles the extension host, the webview editor, the studio page and the
      # MCP server into dist/.
      - run: bun run build
      # Packaging is where .vscodeignore mistakes show up — a bundle that builds
      # can still ship without its media, or ship node_modules with it. Building
      # the .vsix on every PR is how that is found before a tag carries it.
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
