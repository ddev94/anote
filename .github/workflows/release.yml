name: Release

# A release is a tag and nothing more: `git tag v0.1.0 && git push --tags`
# builds the .vsix, attaches it to a GitHub release, and publishes it to the
# Marketplace. Running it by hand builds the same .vsix and leaves it as a run
# artifact without publishing anything, which is how you find out a packaging
# change is broken before a tag carries it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    # One runner is enough: the extension is a bundle of JavaScript with no
    # native dependency and no per-platform build, so the .vsix that comes out
    # of Linux is the one every platform installs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      # The version in package.json is what names the artifact and what VS Code
      # shows in the extensions view. A tag that disagrees with it would publish
      # v0.2.0 containing anote-0.1.0.vsix, which is only ever noticed by
      # whoever installs it.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      # `--no-dependencies` is not an optimisation: esbuild has already bundled
      # everything into dist/, so anything vsce found in node_modules would be a
      # second copy of it.
      - name: Build .vsix
        run: bun run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # At job level rather than on the step that uses it: `secrets` is not a
    # context an `if:` can read, so the token has to reach the condition as an
    # environment variable, and a job-level one is unambiguously in scope there.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      # The GitHub release goes first and always: it is the copy that does not
      # depend on anyone's account still existing, and the one to download and
      # install with `code --install-extension` or "Install from VSIX…".
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh vsix
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ANote ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            vsix/*.vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `--packagePath` publishes the exact file the previous job built and this
      # job just attached to the release — not a rebuild that could differ from
      # it. vsce reads the token from $VSCE_PAT.
      #
      # The token is an Azure DevOps personal access token, all organisations,
      # scope Marketplace › Manage, stored as the VSCE_PAT secret; it belongs to
      # the account that owns the `publisher` in package.json. Until that secret
      # exists the step is skipped rather than failing the tag — the GitHub
      # release above has already happened, and it is the release that matters.
      - name: Publish to the Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath vsix/*.vsix
